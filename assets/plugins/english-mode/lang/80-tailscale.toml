# Tailscale VPN 経由のスマホ接続 (tailscale.rs / remote.rs / app/remote_api.rs)

# ── 見出し ──
"🔒 Tailscale VPN" = "🔒 Tailscale VPN"
"Tailscale 経由 — 同じ tailnet のスマホで QR を読み取って接続" = "Over Tailscale — scan the QR from any phone on the same tailnet"

# ── 段 (tailscale::Stage) ──
"Tailscale が見つかりません" = "Tailscale not found"
"Tailscale が tailnet に繋がっていません" = "Tailscale is not connected to your tailnet"
"Tailscale に繋がっています" = "Connected to Tailscale"
"● {stage} ({ip})" = "● {stage} ({ip})"

# ── 次にすること (tailscale::Stage::hint) ──
"Tailscale アプリを開いてログイン (または「接続」) してください" = "Open the Tailscale app and sign in (or hit Connect)"
"スマホも同じ tailnet に入れておけば、Wi-Fi が違っても繋がります" = "Add your phone to the same tailnet and it connects from any network"
"App Store か tailscale.com から Tailscale を入れてサインインしてください" = "Install Tailscale from the App Store or tailscale.com, then sign in"
"tailscale.com からインストーラを入れてサインインしてください" = "Get the installer from tailscale.com, then sign in"
"curl -fsSL https://tailscale.com/install.sh | sh でインストールできます" = "Install it with: curl -fsSL https://tailscale.com/install.sh | sh"

# ── 待ち受け先 (remote::Bind::Tailscale) ──
"Tailscale の IP のみ (同じ tailnet から)" = "Tailscale IP only (from the same tailnet)"

# ── 切り替え ──
"🔒 Tailscale で待ち受ける" = "🔒 Listen on Tailscale"
"tailnet の IP と 127.0.0.1 だけで待ち受け直します。\n喫茶店や空港の Wi-Fi に居ても、その LAN からは\nポートが見えません (経路も鍵も Tailscale が持ちます)" = "Rebinds to your tailnet IP and 127.0.0.1 only.\nOn café or airport Wi-Fi the port stays invisible to that LAN\n(Tailscale owns the route and the keys)."
"📶 同じ Wi-Fi に戻す" = "📶 Back to the same Wi-Fi"
"0.0.0.0 で待ち受け直します\n(同じ Wi-Fi のスマホから直接繋がるようになります)" = "Rebinds to 0.0.0.0\n(phones on the same Wi-Fi can connect directly again)"
"※ いまは tailnet と PC 自身からだけ届きます。\n　同じ Wi-Fi でも Tailscale に入っていないスマホからは繋がりません" = "※ Only your tailnet and this PC can reach it right now.\n　A phone on the same Wi-Fi but outside Tailscale cannot connect."
"Tailscale の IP で待ち受けています" = "Listening on your Tailscale IP"
"同じ Wi-Fi から繋げるように戻しました" = "Back to accepting connections from the same Wi-Fi"

# ── 届いているか ──
"📶 まだスマホからの接続はありません\n　スマホ側でも Tailscale を繋いで、同じ tailnet に\n　入れてください (ACL で塞いでいないかも確認)" = "📶 No connection from a phone yet\n　Connect Tailscale on the phone too, on the same tailnet\n　(also check your ACLs are not blocking it)"

# ── 張り替えの失敗 ──
"待ち受けの切り替えに失敗しました: {e} (元の待ち受けに戻しました)" = "Could not switch where we listen: {e} (restored the previous one)"

# ── HTTPS (tailscale serve) — スマホの音声入力が動く唯一の形 ──
"Tailscale の HTTPS 経由 — 🎤 音声入力が使えます (QR を読み取って接続)" = "Over Tailscale HTTPS — 🎤 voice input works (scan the QR to connect)"
"Tailscale に TLS を終端させ、tailnet のホスト名で\n本物の証明書 (Let's Encrypt) を出します。スマホから見た URL が\nhttps になるので、ブラウザの音声認識が動きます\n(平文の http では、どの端末でも仕様上ぜったいに動きません)" = "Let Tailscale terminate TLS and issue a real certificate\n(Let's Encrypt) for your tailnet hostname. The phone then sees an\nhttps URL, so the browser's speech recognition works\n(over plain http it can never work, on any device)."
"tailnet の HTTPS 公開 (tailscale serve) を解除して、\n同じ Wi-Fi から繋げるように戻します" = "Turns off HTTPS publishing (tailscale serve) on your tailnet\nand goes back to connecting from the same Wi-Fi"
"※ 最初の 1 回だけ証明書の取得で待つことがあります\n　(失敗したらもう一度読み込んでください。2 回目からは一瞬です)" = "※ Only the very first connection may wait while the certificate is fetched\n　(if it fails, just reload — from the second time on it is instant)"
"127.0.0.1 のみ (Tailscale の HTTPS 経由)" = "127.0.0.1 only (via Tailscale HTTPS)"
"🔒 tailnet の HTTPS 公開を準備しています…" = "🔒 Preparing HTTPS publishing on your tailnet…"
"🔒 証明書を取得しています… (初回だけ 1 分ほどかかることがあります)" = "🔒 Fetching the certificate… (the first time can take about a minute)"
"🔓 tailnet の HTTPS 公開を解除しています…" = "🔓 Turning off HTTPS publishing on your tailnet…"
"tailscale コマンドが見つかりません" = "The tailscale command was not found"
"Tailscale アプリは見つかりましたが、CLI を実行できませんでした" = "The Tailscale app was found, but its CLI could not be run"
"この tailnet では HTTPS 証明書が無効です" = "HTTPS certificates are disabled for this tailnet"
"管理コンソールの DNS 画面で「HTTPS Certificates」を有効にしてください" = "Turn on \"HTTPS Certificates\" on the DNS page of the admin console"
"Tailscale の HTTPS 公開に失敗しました" = "Tailscale could not publish over HTTPS"
"下の出力がそのままの理由です" = "The output below is the reason, verbatim"
"🔓 HTTPS をやめる" = "🔓 Turn off HTTPS"
"🎤 HTTPS で待ち受ける (スマホの音声入力が使えます)" = "🎤 Listen over HTTPS (enables voice input on your phone)"
"🔒 https://{d}/ で待ち受けています (スマホの音声入力が使えます)" = "🔒 Listening on https://{d}/ (voice input works on your phone)"
"管理コンソールの URL をコピーします" = "Copies the admin console URL"
"管理コンソールの URL をコピーしました" = "Copied the admin console URL"
