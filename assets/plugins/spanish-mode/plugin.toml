# spanish-mode — Zaivern Code の UI を Español で表示する言語パック。
#
# 有効にすると UI が Español になり、無効に戻すと「自動」(OS の言語) へ戻ります。
# 言語パックは同時に 1 つだけ有効になります (別のものを有効にすると入れ替わります)。
#
# 訳の実体はバイナリ同梱の `locales/es.json` です。訳を直したいときは
# `~/.zaivern/locales/es.json` に**同じキー**で置くと、そこだけ上書きできます
# (再ビルド不要)。新しい言語を足したいときは `~/.zaivern/locales/<id>.json` を
# 置くだけで 🌐 の一覧に並びます。

[plugin]
name = "spanish-mode"
version = "1.0.0"
author = "Zaivern"
description = "Spanish — Muestra la interfaz en Español"
api = 2
# 入れただけで UI 言語が変わるのは驚きなので、初回は無効で入れる。
default_enabled = false

[language]
id = "es"
name = "Español"
