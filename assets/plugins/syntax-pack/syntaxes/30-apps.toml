fold = "indent"
keywords = [
  "dim", "as", "set", "public", "private", "protected", "friend", "static", "const", "sub",
  "function", "end", "if", "then", "else", "elseif", "select", "case", "for", "each",
  "next", "to", "step", "while", "wend", "do", "loop", "until", "exit", "return", "class",
  "module", "structure", "enum", "interface", "implements", "inherits", "new", "me",
  "mybase", "myclass", "try", "catch", "finally", "throw", "property", "get", "let",
  "option", "explicit", "on", "error", "resume", "byval", "byref", "optional",
  "paramarray", "overrides", "overloads", "shared", "withevents", "raiseevent", "event",
  "delegate", "namespace", "imports", "and", "or", "not", "xor", "mod", "is", "isnot",
  "like", "call", "redim", "erase", "with", "in", "of", "handles", "addhandler",
]
types = [
  "integer", "long", "short", "byte", "single", "double", "decimal", "string", "boolean",
  "date", "object", "variant", "char", "sbyte", "uinteger", "ulong", "ushort",
]
constants = ["true", "false", "nothing", "null", "empty"]
builtins = ["msgbox", "inputbox", "cstr", "cint", "clng", "cdbl", "len", "mid", "left", "right", "trim", "ubound", "lbound", "console"]

