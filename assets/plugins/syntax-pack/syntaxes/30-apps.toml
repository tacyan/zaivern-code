builtins = ["printfn", "printf", "sprintf", "failwith", "ignore", "id", "fst", "snd", "List", "Array", "Seq"]

[[syntax]]
name = "Visual Basic"
extensions = ["vb", "vbs", "bas", "frm", "cls.vb"]
