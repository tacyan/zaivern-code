[[syntax]]
name = "Julia"
extensions = ["jl"]
tokens = ["julia", "jl"]
line_comment = ["#"]
block_comment = [["#=", "=#"]]
strings = ["\""]
multiline_strings = [["\"\"\"", "\"\"\""]]
char_literal = true
ident_extra = "!"
attribute = "@"
fold = "indent"
keywords = [
  "baremodule", "begin", "break", "catch", "const", "continue", "do", "else", "elseif",
  "end", "export", "finally", "for", "function", "global", "if", "import", "in", "isa",
  "let", "local", "macro", "module", "mutable", "primitive", "quote", "return", "struct",
  "try", "type", "using", "where", "while", "abstract", "outer",
]
