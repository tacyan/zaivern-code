  "Int", "Int8", "Int16", "Int32", "Int64", "Int128", "UInt", "UInt8", "UInt16", "UInt32",
  "UInt64", "Float16", "Float32", "Float64", "Bool", "Char", "String", "Symbol", "Vector",
  "Matrix", "Array", "Dict", "Set", "Tuple", "NamedTuple", "Nothing", "Any", "Complex",
  "Rational", "BigInt", "BigFloat", "Number", "Real", "Integer", "AbstractString",
]
constants = ["true", "false", "nothing", "missing", "NaN", "Inf", "pi", "im"]
builtins = [
  "println", "print", "@printf", "length", "size", "push!", "pop!", "append!", "map",
  "filter", "reduce", "sum", "zeros", "ones", "rand", "reshape", "collect", "typeof",
  "isa", "convert", "error", "throw", "include", "@time", "@assert",
]

