strings = ["\""]
multiline_strings = [["\"\"\"", "\"\"\""]]
char_literal = true
attribute = "@"
fold = "brackets"
keywords = [
  "package", "import", "class", "interface", "object", "fun", "val", "var", "if", "else",
  "when", "while", "do", "for", "return", "break", "continue", "in", "is", "as", "by",
  "constructor", "init", "this", "super", "typealias", "throw", "try", "catch", "finally",
  "where", "get", "set", "out", "reified", "inline", "noinline", "crossinline", "suspend",
  "operator", "infix", "external", "tailrec", "vararg", "lateinit", "companion", "data",
  "sealed", "enum", "annotation", "abstract", "final", "open", "override", "private",
  "protected", "public", "internal", "actual", "expect", "const", "dynamic", "value",
]
types = [
  "Int", "Long", "Short", "Byte", "Float", "Double", "Boolean", "Char", "String", "Unit",
  "Any", "Nothing", "Array", "List", "MutableList", "Map", "MutableMap", "Set",
  "MutableSet", "Pair", "Triple", "Sequence", "Flow", "Result", "Number", "Comparable",
]
constants = ["true", "false", "null"]
builtins = [
  "println", "print", "listOf", "mutableListOf", "mapOf", "mutableMapOf", "setOf",
  "arrayOf", "arrayListOf", "let", "run", "apply", "also", "with", "require", "check",
  "lazy", "TODO", "error", "repeat", "runCatching", "launch", "async", "runBlocking",
]

