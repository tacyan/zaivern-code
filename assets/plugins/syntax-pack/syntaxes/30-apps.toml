keywords = [
  "abstract", "as", "assert", "async", "await", "base", "break", "case", "catch", "class",
  "const", "continue", "covariant", "default", "deferred", "do", "dynamic", "else", "enum",
  "export", "extends", "extension", "external", "factory", "final", "finally", "for",
  "get", "hide", "if", "implements", "import", "in", "interface", "is", "late", "library",
  "mixin", "new", "on", "operator", "part", "required", "rethrow", "return", "sealed",
  "set", "show", "static", "super", "switch", "sync", "this", "throw", "try", "typedef",
  "var", "void", "when", "while", "with", "yield",
]
types = [
  "int", "double", "num", "bool", "String", "List", "Map", "Set", "Future", "Stream",
  "Object", "Function", "Iterable", "Symbol", "Runes", "Duration", "DateTime", "Widget",
  "BuildContext", "State", "StatelessWidget", "StatefulWidget",
]
