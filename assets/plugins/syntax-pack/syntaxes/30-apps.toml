  "let", "mutable", "rec", "and", "or", "not", "in", "if", "then", "elif", "else", "match",
  "with", "when", "function", "fun", "try", "finally", "raise", "for", "to", "downto",
  "while", "do", "done", "use", "new", "type", "member", "abstract", "override",
  "interface", "inherit", "static", "val", "module", "namespace", "open", "exception",
  "of", "begin", "end", "yield", "return", "lazy", "assert", "upcast", "downcast", "base",
  "null", "struct", "class", "delegate", "enum", "extern", "global", "inline", "internal",
  "private", "public", "sig", "as", "async", "task",
]
types = [
  "int", "int64", "float", "double", "single", "decimal", "string", "bool", "char", "unit",
  "list", "array", "option", "seq", "Map", "Set", "byte", "sbyte", "obj", "exn", "Async",
