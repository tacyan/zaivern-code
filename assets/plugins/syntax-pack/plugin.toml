[plugin]
name = "syntax-pack"
version = "1.0.0"
author = "Zaivern"
description = "主要プログラミング言語の構文ハイライト。syntect の既定に無い TypeScript / Kotlin / Swift / Dart / Zig / TOML / Dockerfile / Terraform など 53 言語を足し、別名 22 種 (.tsx / .vue / .mjs / .json5 …) も解決する"
api = 3

# 構文定義は syntaxes/ の *.toml をまとめて読む。
# 1 言語 = 1 ブロック。追加も削除もこのディレクトリの中だけで完結する。
[[syntax]]
path = "syntaxes"
