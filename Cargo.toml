[package]
name = "zaivern-code"
version = "0.23.0"
edition = "2021"
# MSRV。README / install.sh / install.ps1 が「1.88 以上」と案内している以上、
# **cargo にも同じことを言わせる**。ここが無いと 1.88 では通らない構文や依存が
# 入っても誰も気付かず、案内どおりの環境で `cargo install` が失敗する
# (利用者側にだけ見える壊れ方をする)。
# CI の msrv ジョブが 1.88.0 で `cargo check --locked` を回して裏を取る。
rust-version = "1.88"
description = "Zaivern Code — Rust-native AI cockpit editor (Zed × Cmux × AGI Cockpit)"
license = "Apache-2.0"

[[bin]]
name = "zai"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
syntect = "5.2"
# bat が使っている**拡張シンタックス／テーマセット**を syntect 向けに配布する crate。
# syntect 同梱の既定セットは 75 構文しか無く、TypeScript / TSX / Vue / Svelte /
# Kotlin / Zig / TOML / GraphQL / Terraform / Dart / Elixir / Nix / Solidity /
# Dockerfile などが**丸ごと欠けている** (実測: 既定 75 → 拡張 220 構文)。
#   * ライセンス MIT OR Apache-2.0 (本体 Apache-2.0 と両立)
#   * 純 Rust。構文定義は `include_bytes!` された syntect のダンプなので、
#     実行時にファイルを探しに行かない = どの OS / どのインストール先でも動く
#   * syntect ^5.3 を要求し、こちらのロックは 5.3.0。バージョン衝突は起きない
#   * 既定 feature は `syntect-onig` のみで、既に有効な syntect の onig と同じ
two-face = "0.5"
portable-pty = "0.9"
vt100 = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
rfd = "0.17"
# ico は `zai app install` の Windows ショートカットアイコン生成に使う
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
qrcode = { version = "0.14", default-features = false }
# 端末の文字化け対策。PTY から来るバイト列が UTF-8 とは限らない
# (日本語 Windows の CP932、`iconv` や古い CLI が吐く ISO-2022-JP 等)。
# vt100 は UTF-8 しか解さず、ISO-2022-JP の切替列 `ESC $ B` を「知らない
# エスケープ」として黙って食べるため、**後続の JIS バイトが ASCII として
# 画面に残る** (ひらがな区の先行バイトが 0x24 なので `$` の羅列になる)。
# 実測と経緯は src/textenc.rs の「記録: 端末に出る「$ だらけの文字化け」の正体」。
# 既に推移依存として Cargo.lock に居るのでビルド時間もサイズも増えない。
encoding_rs = "0.8"
# クリップボードの画像取得 (⌘V/Ctrl+V で画像を PNG 保存してパス挿入)。
# egui-winit も arboard を使うが image-data feature なしのため直接依存する。
# wayland-data-control は Linux (Wayland) 専用で他 OS のビルドには影響しない。
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }
# PDF タブのテキスト抽出 (editor.rs の BufferKind::Pdf)。
# ライセンス MIT / 純 Rust (lopdf ベース)。ネイティブライブラリも
# 実行時ダウンロードも要らないので、素の `cargo build` だけで
# macOS / Windows / Linux が通る。
#   * mupdf は AGPL-3.0 で本プロジェクト (Apache-2.0) と両立しない
#   * pdfium-render は OS ごとの prebuilt libpdfium が要る
# のでいずれも採らない。
pdf-extract = "0.12"
# 「ファイル間で検索」の正規表現エンジン (file_search.rs)。自前のバックトラッキング
# 実装は `(a+)+$` のような入力で破滅的バックトラック (ReDoS) を起こすため置き換えた。
# regex は有限オートマトン方式で**入力長に対して線形時間**を保証し、後方参照や
# 先読みを持たない代わりにユーザー入力のパターンを安全に走らせられる。
# ライセンスは MIT OR Apache-2.0、依存も純 Rust (build.rs / ネイティブ無し)。
# regex-syntax は syntect 経由で既にロックに入っており、増える実体は僅か。
regex = "1"

# オフライン・ライセンス認証 (license.rs) の Ed25519 署名**検証**。
# アプリに入るのは公開鍵だけで、秘密鍵はリポジトリにもバイナリにも無い
# (キーの発行は tools/licgen の独立クレート)。
#   * ライセンスは BSD-3-Clause。本体 (Apache-2.0) と両立する寛容ライセンスで、
#     コピーレフトではなく表示義務のみ (MIT/Apache 版は存在しない)
#   * 純 Rust・build.rs もネイティブライブラリも無く、素の `cargo build` が
#     macOS / Windows / Linux で通る
#   * 既定 feature は fast / zeroize だけ。**rand_core を入れない**ので
#     既存の rand 系 (0.8 / 0.9 / 0.10 が同居している) と衝突しない。
#     アプリ側に鍵生成は無く、必要なのは検証だけなので乱数は要らない
ed25519-dalek = "3"
# ライセンスキーの Base64URL 部分。0.22 は syntect → plist 経由で既にロックへ
# 入っているため、直接依存にしても依存グラフは 1 つも増えない。
base64 = "0.23"
# Cloud Execution の Provider API (Hetzner 等) を叩く**同期**の HTTP client。
# 呼ぶのは `src/features/cloud_execution/provider/http.rs` の 1 ファイルだけで、
# 番人テスト (`ureqの名前はこのファイルにしか出ない`) がそれを強制する。
#   * **同期**。Cloud API のためだけに tokio ランタイムを持ち込まない
#   * 純 Rust + rustls。ネイティブの OpenSSL も実行時ダウンロードも要らず、
#     素の `cargo build` が macOS / Windows / Linux で通る
#   * TLS 検証あり。証明書を確かめない経路をこのアプリに作らない
#   * MSRV 1.85 ≤ 本体の 1.88。増える依存は 11 crate だけ (実測)
#   * `curl` / `Invoke-WebRequest` を子プロセスで呼ぶ形は採らない —
#     外部コマンドの有無で挙動が変わるうえ、URL とトークンがコマンド行に載る
#   * default-features を切っているのは gzip / json / cookies が要らないため
#     (要るのは GET / POST / DELETE と Bearer ヘッダだけ)
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

# セッション破棄時のプロセス**グループ**への killpg (procx::kill_tree)。
# portable-pty は子を setsid するため pgid == pid で、グループごと落とせば
# ログインシェルの子・孫まで確実に片付く (CI のプロセスツリー漏れ対策)。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows の**本物のごみ箱** (file_tree::trash) を呼ぶための Win32 API。
# 削除は既定でゴミ箱行きにするので、3 OS ぶんの実装が要る
# (macOS は ~/.Trash、Linux は freedesktop 仕様で自前実装 = 依存ゼロ。
#  Windows だけは SHFileOperationW を叩かないと本物のごみ箱へ入らない)。
#   * ライセンス MIT OR Apache-2.0 (本体 Apache-2.0 と両立)
#   * Microsoft 公式の**純 Rust** バインディング。C の toolchain も
#     実行時 DLL の同梱も要らず、素の `cargo build` が通る
#   * windows-sys 0.59 は既に winit / eframe 経由で Cargo.lock に入っている
#     ため、依存グラフに増える実体は 0
#   * cfg(windows) 限定なので macOS / Linux のビルドには一切入らない
#   * `trash` クレートは採らない: macOS でゴミ箱の中のパスを返さないため
#     「削除の取り消し」が作れない (自前実装なら戻り先が分かる)
[target.'cfg(windows)'.dependencies]
# Win32_Globalization は `GetUserDefaultLocaleName` (UI 表示言語の自動判定)。
# Windows は言語を環境変数へ置かないので、これが無いと `auto` が
# **Windows でだけ**効かない (macOS/Linux では気付けない壊れ方をする)。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_Shell",
] }

# Windows のタスクマネージャー「説明」列に "Zaivern Code" を出すための
# VERSIONINFO リソースを build.rs から埋め込む。
#   * ライセンス MIT / 純 Rust (winres の後継フォーク)
#   * cfg(windows) 限定なので macOS / Linux の `cargo build` には入らない
#   * リソースのコンパイルに要る rc.exe / windres が無くても build.rs 側で
#     warning に落として続行するため、ビルドが壊れることはない
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

# vt100 0.15.2 の visible_rows は scrollback offset が画面行数を超えると
# debug ビルドで減算オーバーフロー panic する (release は wrap で偶然動く)。
# 修正版をベンダリングして差し替える (vendor/vt100/src/grid.rs 参照)。
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
