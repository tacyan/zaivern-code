# 3-OS テストワークフロー。
#
# Linux で cargo test を直接使わない理由: terminal:: (実PTY) テストが
# 単一の長寿命 cargo test プロセス内でプロセスツリーをリークし、
# ランナーのハートビート喪失 (突然死) を引き起こすため。
# cargo-nextest はテストごとにプロセスを分離し、slow-timeout 到達時に
# プロセスグループごと kill する (.config/nextest.toml の profile.ci 参照)。
#
# ステップを「非 terminal」「terminal (実PTY)」に分けているのは、
# 万一ランナーが死んだ場合にどちらが原因か即座に切り分けるため。
name: Test

on:
  push:
    branches: ["night/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # デバッグ情報を落としてビルド時間とキャッシュサイズを削減。
  RUSTFLAGS: -C debuginfo=0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # nextest の slow-timeout が効かない事態への最終防壁。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 依存クレートのビルド結果をコミット間で使い回す (release.yml と同方針)。
      # これが無いと毎回フルビルドで待ち時間が数倍になる。
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # release.yml で実績のある eframe/egui 0.29 + rfd (GTK3) 向けパッケージ一覧。
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: taiki-e/install-action@nextest

      - name: Non-terminal tests
        run: cargo nextest run --locked --profile ci -E 'not test(/^terminal::/)'

      # 実PTYテスト群。.config/nextest.toml の pty グループで直列化される。
      - name: Terminal (real PTY) tests
        run: cargo nextest run --locked --profile ci -E 'test(/^terminal::/)'
