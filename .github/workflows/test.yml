# 3-OS テストワークフロー — 5分予算設計。
#
# ■ 設計目標: 全テストが CI で 5 分以内 (wall-clock) に完了する。
#   - OS ごとに「fast (terminal:: 以外)」「pty (terminal:: のみ)」の 2 ジョブへ分割し
#     並列実行する。wall-clock は 2 ジョブの max であり sum ではない。
#   - **Windows の fast はさらに 3 分割**する。実測 6 run で 321〜496 秒と
#     6 回とも予算を超えていた (テストの段だけで 390 秒)。nextest は
#     テスト 1 件 = 1 プロセスなので、プロセス生成が高価な Windows では
#     4,950 件ぶんの起動費が丸ごと効く。分けないと 1 台では削れない。
#   - 同一 OS の各ジョブは rust-cache の shared-key で同じキャッシュを共有する
#     (shared-key は自動のジョブ名ベースキーを置き換え、複数ジョブ間で安定 —
#     全ジョブが同じ RUSTFLAGS / プロファイルでビルドするため完全に再利用可能)。
#   - lint ジョブは ubuntu 1 台のみ。3 OS で回しても同じ診断しか出ないため無駄。
#     9 本のテストジョブ (fast×5 + pty×3 + windows-lease×1) と並列に走るので
#     wall-clock は増えない。
#   - windows-lease は lease:: / instances:: を **素の cargo test** で回す
#     Windows 専用の 1 本。nextest はテスト 1 件 = 1 プロセスなので、
#     「1 プロセス内で複数スレッドが同じ台帳ロックを取り合う」経路が
#     Windows で一度も走らない。そこだけを埋める (詳細はジョブのコメント)。
#   - ハング時のコストは nextest の slow-timeout (terminate-after=1) で
#     グローバル ~65 秒 / terminal:: ~50 秒に抑える (.config/nextest.toml)。
#   - **apt は道具 (`tools/ci-linux-deps.sh`) 越しに呼ぶ。** 素の apt は HTTP に
#     時限を持たないので、詰まったミラーを掴むと無音のままジョブの上限まで待つ
#     (実測: run 32078628866 の msrv が 13 分無反応。同時刻の fast は同じ apt が 58 秒)。
#   - **timeout-minutes は実測の 2〜3 倍**に置く (5〜10 分)。15 分のままだと
#     「5 分予算」と矛盾し、固まったときに 15 分待たされるだけになる。
# ■ 唯一の例外: Cargo.lock 変更直後の初回 run はキャッシュ再構築のため
#   フルビルドとなり 5 分を超えうる (デバッグ情報を落として最小化済み)。
#
# Linux で cargo test を直接使わない理由: terminal:: (実PTY) テストが
# 単一の長寿命 cargo test プロセス内でプロセスツリーをリークし、
# ランナーのハートビート喪失 (突然死) を引き起こすため。
# cargo-nextest はテストごとにプロセスを分離し、slow-timeout 到達時に
# プロセスグループごと kill する (.config/nextest.toml の profile.ci 参照)。
name: Test

# main と PR にも品質ゲートを張る。night/** は従来どおり push で即回す。
# paths-ignore: ドキュメントだけの変更で 7 ジョブ × 3 OS を焚かない
# (README の同期コミットが多いリポジトリなので効果が大きい)。
# 注意: main にブランチ保護の required checks を設定する場合、
#   paths-ignore でスキップされた run は「未実行」のままマージをブロックする。
#   その時は required checks を外すか、常緑のダミージョブを足すこと。
on:
  push:
    branches: ["main", "night/**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

# GITHUB_TOKEN は既定で読み取りだけ。テストは何も書き込まないので、
# 侵害されたアクションが押し込める範囲をここで潰しておく
# (リリースワークフローと違い、このワークフローに書き込みは 1 つも要らない)。
permissions:
  contents: read

# 同一ブランチへの連続 push では古い run をキャンセルし、ランナーを節約する。
#
# キーに **event 名を含める**のが要点。含めないと push run と pull_request run が
# 同じグループへ入り、**後から来た方が先の方をキャンセルする**。同一コミットの
# 二重実行は確かに消えるが、ブランチの履歴には「7 ジョブ全部 cancelled」が残り、
# テストが通っているのに落ちたように見える (実際にそう報告された)。
#
# 二重実行は下の `if:` で断つ — 同一リポジトリからの PR は push run が既に
# 同じコミットを見ているので PR 側のジョブを丸ごと飛ばす。fork からの PR は
# push イベントが飛んでこないので、そちらだけ PR run が実体を持つ。
# これで「キャンセルもされず、二重にも走らない」。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # デバッグ情報を落としてビルド時間とキャッシュサイズを削減。
  # 注意: 両ジョブで同一 RUSTFLAGS であること (キャッシュ共有の前提)。
  RUSTFLAGS: -C debuginfo=0

jobs:
  # terminal:: 以外の全テスト。表示名: "fast (ubuntu-latest)" など。
  fast:
    # 同一リポジトリからの PR のうち、**push run が実際に走るブランチ**だけを
    # スキップする (二重実行になるだけで得るものが無いため)。
    #
    # 以前は「同一リポジトリなら push run が見ているはず」と決め打っていたが、
    # 上の `on.push.branches` は main と night/** しか拾わない。そのため
    # **feature ブランチからの PR は push run も PR run も走らず、CI が
    # 一度も回らないまま main へ入れられる状態**だった (実際に 43,000 行の
    # 変更が無検証のまま PR になり、手動起動して初めて 3 OS のうち 2 つで
    # 落ちることが分かった)。判定は push の対象ブランチと必ず揃えること。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.event.pull_request.head.ref == 'main' ||
        startsWith(github.event.pull_request.head.ref, 'night/'))
    # **Windows だけ 3 分割する。** 実測 6 run ぶんの wall-clock:
    #   windows 321 / 387 / 387 / 389 / 470 / 496 秒 — **6 回とも 5 分超**
    #   macos   194 / 204 / 235 / 266 / 270 / 313 秒
    #   ubuntu  209 / 218 / 219 / 221 / 227 / 244 秒
    # 内訳を見ると Windows は**テストの段だけで 390 秒**、固定費 (checkout +
    # toolchain + cache + nextest 導入) が 100 秒。nextest は**テスト 1 件
    # につき 1 プロセス**を起こすので、プロセス生成が高価な Windows では
    # 4,950 件ぶんの起動費がそのまま効く。1 台では削れない。
    #
    # 分割すると固定費だけは各シャードに残るが、**並列なので wall-clock は
    # max であって sum ではない**: 100 + 390/3 ≒ 230 秒 (実測 3m50〜4m36)。
    #
    # macos も 2 分割する。テストの段のばらつきが大きく (173〜282 秒)、
    # 1 台だと 5m23 まで伸びた。**固定費が 40 秒しかない**ので、2 台にしても
    # 課金 (10 倍) はほぼ増えないまま wall-clock が半分になる。
    # ubuntu は 1 台で 2m49 と余裕があるので分けない
    # (効かない所に台数を足さない)。
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 1 }
          - { os: macos-latest, shard: 1, shards: 2 }
          - { os: macos-latest, shard: 2, shards: 2 }
          - { os: windows-latest, shard: 1, shards: 3 }
          - { os: windows-latest, shard: 2, shards: 3 }
          - { os: windows-latest, shard: 3, shards: 3 }
    name: fast (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    # nextest の slow-timeout が効かない事態への最終防壁。
    # 予算 5 分の倍 = 「遅い」と「固まった」を取り違えない余裕。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA 固定すると github.action_ref が SHA になり、既定の toolchain を
      # ref 名から拾えなくなる。**toolchain: を必ず明示する**
      # (書き忘れるとツールチェーン解決に失敗してジョブが落ちる)。
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @2026-08-05
        with:
          toolchain: stable

      # 依存クレートのビルド結果をコミット間・fast/pty ジョブ間で使い回す。
      # shared-key はジョブ名ベースの自動キーを置き換えるため、
      # 同一 OS の fast と pty が同じキャッシュを読み書きする。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.os }}
          cache-on-failure: true

      # release.yml で実績のある eframe/egui 0.29 + rfd (GTK3) 向けパッケージ一覧。
      - name: Linux deps
        if: runner.os == 'Linux'
        # 時限と再試行は道具の側に 1 本だけ置く (`--self-test` で毎回証明する)。
        # 素の `apt-get` は HTTP に時限を持たないので、詰まったミラーを掴むと
        # **無音のままジョブの timeout まで待つ** (実測 13 分。同時刻の別ジョブは 58 秒)。
        run: sh tools/ci-linux-deps.sh --lld

      # ref 名がツール名を兼ねる糖衣は SHA 固定と両立しないので tool: を明示する。
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: nextest

      # `--partition count:M/N` は nextest がテストを N 本へ振り分ける
      # (シャード 1 台では走らないテストが必ずある = **全シャードが緑で
      # 初めて全件緑**)。1/1 のときは今までと 1 件も変わらない。
      - name: Tests (実PTY 以外の全て)
        run: cargo nextest run --locked --no-fail-fast --profile ci --partition count:${{ matrix.shard }}/${{ matrix.shards }} -E 'not test(/^terminal::[a-z0-9_]*pty[a-z0-9_]*::/)'

      # vendor/vt100 はワークスペースメンバーではないため、明示的に走らせないと
      # 敵対的入力テスト (hostile.rs) が一切実行されない。
      # 分割しても中身は同じなので**先頭のシャードだけ**が回す (12 秒 × 台数の無駄を避ける)。
      - name: vendored vt100 tests
        if: matrix.shard == 1
        run: cargo test --manifest-path vendor/vt100/Cargo.toml

  # 実PTYテスト群。.config/nextest.toml の pty グループで直列化される。
  # 表示名: "pty (ubuntu-latest)" など。
  pty:
    # 同一リポジトリからの PR のうち、**push run が実際に走るブランチ**だけを
    # スキップする (二重実行になるだけで得るものが無いため)。
    #
    # 以前は「同一リポジトリなら push run が見ているはず」と決め打っていたが、
    # 上の `on.push.branches` は main と night/** しか拾わない。そのため
    # **feature ブランチからの PR は push run も PR run も走らず、CI が
    # 一度も回らないまま main へ入れられる状態**だった (実際に 43,000 行の
    # 変更が無検証のまま PR になり、手動起動して初めて 3 OS のうち 2 つで
    # 落ちることが分かった)。判定は push の対象ブランチと必ず揃えること。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.event.pull_request.head.ref == 'main' ||
        startsWith(github.event.pull_request.head.ref, 'night/'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 直列実行のためわずかに長めの防壁。実測 (6 run): windows 234s / macos 135s /
    # ubuntu 118s が最大なので、8 分あれば「遅い」と「固まった」を取り違えない。
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA 固定すると github.action_ref が SHA になり、既定の toolchain を
      # ref 名から拾えなくなる。**toolchain: を必ず明示する**
      # (書き忘れるとツールチェーン解決に失敗してジョブが落ちる)。
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @2026-08-05
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.os }}
          cache-on-failure: true

      - name: Linux deps
        if: runner.os == 'Linux'
        # 時限と再試行は道具の側に 1 本だけ置く (`--self-test` で毎回証明する)。
        # 素の `apt-get` は HTTP に時限を持たないので、詰まったミラーを掴むと
        # **無音のままジョブの timeout まで待つ** (実測 13 分。同時刻の別ジョブは 58 秒)。
        run: sh tools/ci-linux-deps.sh --lld

      # ref 名がツール名を兼ねる糖衣は SHA 固定と両立しないので tool: を明示する。
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: nextest

      - name: Terminal (real PTY) tests
        run: cargo nextest run --locked --no-fail-fast --profile ci -E 'test(/^terminal::[a-z0-9_]*pty[a-z0-9_]*::/)'

  # ファイル所有リース (lease::) と実行中インスタンスのレジストリ (instances::) を
  # **Windows で実際に実行する**最小ジョブ。表示名: "windows (lease/instances)"。
  #
  # ■ なぜ fast (windows-latest) と別に要るのか — 2 つとも実際の穴である。
  #   1. **nextest はテスト 1 件につき 1 プロセス**なので、「1 つのプロセスの
  #      中で複数スレッドが同じ台帳ロックを取り合う」経路が Windows で
  #      一度も走らない。lease は `create_new` の排他と `rename` の置換
  #      (Windows は MoveFileEx) に乗っているので、ここは OS ごとに挙動が違う。
  #      素の `cargo test` は 1 プロセス + スレッド並列なのでその経路を通る。
  #   2. fast の `-E 'not test(...)'` は**ブロックリスト**である。誰かが
  #      除外を広げた瞬間に lease:: が Windows から静かに消えても、
  #      緑のままなので気付けない。**このジョブは消えれば必ず目に見える。**
  #
  # ■ 最小構成: matrix 無し・apt も choco も無し (Windows は依存パッケージ不要)。
  #   キャッシュは fast / pty と同じ shared-key を読む — 同じ RUSTFLAGS /
  #   プロファイルなので依存クレートのビルドはそのまま再利用され、
  #   このジョブが増やすのは zai 本体のコンパイルとリンクだけ。
  windows-lease:
    # 判定は fast / pty / lint と必ず同じにする (揃えないと「PR でだけ
    # 走らない」「push でだけ走らない」というムラが出る)。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.event.pull_request.head.ref == 'main' ||
        startsWith(github.event.pull_request.head.ref, 'night/'))
    name: windows (lease/instances)
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA 固定すると github.action_ref が SHA になり、既定の toolchain を
      # ref 名から拾えなくなる。**toolchain: を必ず明示する**
      # (書き忘れるとツールチェーン解決に失敗してジョブが落ちる)。
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @2026-08-05
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-windows-latest
          cache-on-failure: true

      # 2 ステップに分けるのは、落ちたときに**どちらのモジュールか**が
      # ジョブの画面だけで分かるようにするため (再現コマンドがそのまま出る)。
      - name: "lease:: (ファイル所有リース)"
        run: "cargo test --bin zai --locked lease::"

      - name: "instances:: (実行中インスタンスのレジストリ)"
        run: "cargo test --bin zai --locked instances::"

  # MSRV (Cargo.toml の rust-version) を **実際に 1.88.0 でコンパイルして**裏取りする。
  #
  # ■ なぜ要るのか — README / install.sh / install.ps1 は 3 つとも「Rust 1.88 以上」と
  #   案内している。CI が stable でしか回らないと、1.88 では通らない構文や依存が
  #   入っても**誰も気付かない**。壊れるのは利用者の `cargo install` だけ、という
  #   いちばん見えない形で出る。
  #
  # ■ check だけで足りる — MSRV が問われるのは型検査と構文であって実行時ではない。
  #   test まで回すと 1.88 用のキャッシュをもう 1 セット持つことになり、
  #   得られる情報は増えないのに wall-clock だけ伸びる。
  #   `--all-targets` は必須: これが無いと #[cfg(test)] のコードを一切見ない。
  msrv:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.event.pull_request.head.ref == 'main' ||
        startsWith(github.event.pull_request.head.ref, 'night/'))
    name: msrv (1.88.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @2026-08-05
        with:
          # Cargo.toml の rust-version と**同じ値**であること。
          # 片方だけ上げると、案内と実測がずれたまま緑になる。
          toolchain: "1.88.0"

      # stable のキャッシュとは別に持つ (rustc が違えば成果物は共有できない)。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv-188
          cache-on-failure: true

      - name: Linux deps
        # 時限と再試行は道具の側に 1 本だけ置く (`--self-test` で毎回証明する)。
        # 素の `apt-get` は HTTP に時限を持たないので、詰まったミラーを掴むと
        # **無音のままジョブの timeout まで待つ** (実測 13 分。同時刻の別ジョブは 58 秒)。
        run: sh tools/ci-linux-deps.sh --lld

      # Cargo.toml の rust-version と、ここで使う toolchain がずれていないことを
      # **ワークフロー自身に確かめさせる** (人間の同期に頼らない)。
      - name: rust-version と一致していることを確かめる
        run: |
          set -euo pipefail
          want=$(cargo metadata --no-deps --format-version 1 | sed -En 's/.*"rust_version":"([^"]+)".*/\1/p')
          got=$(rustc --version | sed -En 's/^rustc ([0-9]+\.[0-9]+).*/\1/p')
          echo "Cargo.toml rust-version=$want / このジョブの rustc=$got"
          [ "$want" = "$got" ] || { echo "::error::MSRV がずれている (Cargo.toml=$want, job=$got)"; exit 1; }

      - name: cargo check (MSRV)
        run: cargo check --locked --all-targets

  # ワンライナーインストーラの静的検査。
  #
  # ■ なぜ Rust のテストだけでは足りないのか — cli.rs の番人テストは
  #   「checksums.txt を検証する記述があるか」を**文字列で**見ているだけで、
  #   その sh / PowerShell が**構文として正しいか**は一切見ていない。
  #   install.sh は `curl | sh` で実行されるので、構文エラーは
  #   「利用者の端末でだけ壊れる」形になる。ここで潰す。
  #
  # ubuntu ランナーには sh / shellcheck / pwsh が最初から入っている
  # (pwsh が居るので Windows ランナーを 1 台増やさずに .ps1 まで見られる)。
  installers:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.event.pull_request.head.ref == 'main' ||
        startsWith(github.event.pull_request.head.ref, 'night/'))
    name: installers + tools (sh / ps1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install.sh (構文 + shellcheck)
        run: |
          set -euo pipefail
          sh -n install.sh
          # SC1091: `. "$HOME/.cargo/env"` は実行時にしか存在しないので追えない。
          # これだけは構造的に消せないため除外する (他は 0 件で通っている)。
          shellcheck --shell=sh --exclude=SC1091 install.sh

      - name: install.ps1 (パーサに通す)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path './install.ps1').Path, [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
          }
          Write-Host "install.ps1: 構文エラー 0 件"

      # tools/*.sh は 21 本あり、重いもの (ベンチ・証明の網羅版) は
      # xplat.yml の週次でしか動かさない。**壊れていることに 1 週間気付かない**
      # のを避けるため、実行はせずに構文と静的検査だけをここで毎回通す。
      # cargo を 1 度も呼ばないので実測 7.3 秒。既存の installers ジョブ
      # (timeout 5 分・中身は install.sh/ps1 の検査だけ) に相乗りするので、
      # **ランナーは 1 台も増えず** wall-clock も動かない。
      #
      # --severity=error に絞るのは、この 21 本が今ちょうど 0 件で通るから
      # (whitelist ではなくラチェット: 新しく増えたエラーだけが赤くなる)。
      # 警告まで含めると初回から赤でゲートとして機能しない。
      - name: tools/*.sh (構文 + shellcheck)
        run: |
          set -euo pipefail
          n=0
          for f in tools/*.sh; do
            sh -n "$f"
            n=$((n + 1))
          done
          shellcheck --shell=sh --severity=error tools/*.sh
          echo "tools/*.sh: ${n} 本すべて通過"

      # **時限は毎回わざと撃たせて証明する。** 空回りする時限を残さない。
      # これが無いと「時限が消えていること」に気付けるのは、次に固まった
      # ときだけになる (そのときには 13 分待たされている)。
      # `--self-test` は sudo も apt も要らないので 10 秒で終わる。
      - name: Linux 依存の時限が効くこと (--self-test)
        run: sh tools/ci-linux-deps.sh --self-test

  # GUI E2E の **層 2** — 実バイナリを起こして、生きていることを確かめる
  # (起動して指定秒数生存 / panic.log が 0 バイト / プロセスツリーごと片付く)。
  #
  # ■ なぜ fast へ足さないのか (実測)
  #   `cargo build --bin zai` は **テストバイナリとは別のコンパイル単位**で、
  #   ローカル実測 **4m44s**。fast が作るのはテスト用の成果物だけなので
  #   再利用できず、fast へ足すとそれだけで 5 分予算を食い潰す。
  #   **独立した並列ジョブ**にすれば wall-clock は max であって sum ではないので、
  #   既存ジョブを 1 秒も遅くしない。`tools/gui-smoke.sh --seconds 5` 自体は
  #   実測 **7.36s** で、費用はほぼ全部がビルドである。
  #
  # ■ なぜ macOS 1 台だけなのか
  #   ubuntu のランナーには X も Wayland も無い。`xvfb-run` を足せば「開く」が、
  #   それは llvmpipe という**別物**を測ることになる (gui-smoke.sh 自身も
  #   ヘッドレス Linux では理由を出して `[skip]` で降りる)。
  #   macOS は常にウィンドウサーバがあるので、ここだけが実物を測れる。
  #
  # ■ 層 1 (`e2e::`) はここに要らない。fast の
  #   `-E 'not test(/^terminal::...pty...::/)'` が**もう拾っている**。
  gui-smoke:
    # fast / pty / msrv / installers / lint と**同じ判定**にすること。
    # 揃えないと「PR でだけ走らない」「push でだけ走らない」というムラが出る。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.event.pull_request.head.ref == 'main' ||
        startsWith(github.event.pull_request.head.ref, 'night/'))
    name: gui smoke (macos)
    runs-on: macos-latest
    # ビルドが支配的。キャッシュが冷えた回だけ長くなるので少し厚めに取る。
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @2026-08-05
        with:
          toolchain: stable

      # 同じ OS の fast / pty と**同じ shared-key** を読む。RUSTFLAGS も
      # プロファイルも同じなので依存クレートのビルドはそのまま再利用でき、
      # このジョブが増やすのは zai 本体のコンパイルとリンクだけになる
      # (xplat.yml の shapes ジョブと同じ流儀)。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-macos-latest
          cache-on-failure: true

      - name: zai を作る
        run: cargo build --bin zai --locked

      # **本物の ~/.zaivern に触らせない。** ハーネス自身も差し替えるが、
      # 二重に張る (CLAUDE.md: サブエージェントに実 ~/.zaivern を触らせない)。
      #
      # ■ `[skip]` を緑にしない。
      #   gui-smoke.sh は「開けない環境」「バイナリが無い / src より古い」で
      #   **終了コード 0 のまま `[skip]` で降りる**。手元ではそれが正しいが、
      #   CI でそれを通すと**何も検査しないジョブが永久に緑**になる。
      #   ここは必ず実測できる前提 (macOS + 直前に build 済み) なので、
      #   降りたら赤にする。
      - name: GUI スモーク (起動して 5 秒生存するか)
        env:
          ZAIVERN_HOME: ${{ runner.temp }}/zaivern-home
        run: |
          set -euo pipefail
          mkdir -p "$ZAIVERN_HOME"
          out=$(sh tools/gui-smoke.sh --seconds 5 2>&1)
          echo "$out"
          if echo "$out" | grep -q '^\[skip\]'; then
            echo "::error::層 2 が実行されずに降りた (このジョブでは skip は不合格)"
            exit 1
          fi

  # 静的解析。ubuntu 1 台だけ (診断は OS 非依存。3 OS で回すのは丸損)。
  #
  # ■ cargo fmt --check は 2026-08-02 に有効化した。
  #   それまで 55 ファイル / 1475 箇所が未適用で、有効にすると全 PR が初回から
  #   赤くなるためゲートとして機能しなかった。一括 fmt は複数エージェントの
  #   並行編集と全面衝突するので、**並行作業がゼロになった瞬間**にまとめて
  #   適用し、そのまま --check を入れて二度と溜まらないようにしてある。
  lint:
    # 同一リポジトリからの PR のうち、**push run が実際に走るブランチ**だけを
    # スキップする (二重実行になるだけで得るものが無いため)。
    #
    # 以前は「同一リポジトリなら push run が見ているはず」と決め打っていたが、
    # 上の `on.push.branches` は main と night/** しか拾わない。そのため
    # **feature ブランチからの PR は push run も PR run も走らず、CI が
    # 一度も回らないまま main へ入れられる状態**だった (実際に 43,000 行の
    # 変更が無検証のまま PR になり、手動起動して初めて 3 OS のうち 2 つで
    # 落ちることが分かった)。判定は push の対象ブランチと必ず揃えること。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.event.pull_request.head.ref == 'main' ||
        startsWith(github.event.pull_request.head.ref, 'night/'))
    name: lint (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @2026-08-05
        with:
          toolchain: stable
          # dtolnay/rust-toolchain は --profile minimal 相当。rustfmt は既定で
          # 入らないので明示する (下の債務レポートが cargo fmt を呼ぶため)。
          components: clippy, rustfmt

      # lint は clippy-driver 経由で fingerprint が変わるため、
      # test ジョブとキャッシュを共有すると互いに上書きし合って
      # 毎回ミスになる。専用の shared-key を持たせる。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint-ubuntu
          cache-on-failure: true

      # eframe/egui + rfd のビルドスクリプトが pkg-config gtk+-3.0 を要求するため、
      # clippy (= 実際に型検査する) にも同じ依存が必要。
      - name: Linux deps
        # 時限と再試行は道具の側に 1 本だけ置く (`--self-test` で毎回証明する)。
        # 素の `apt-get` は HTTP に時限を持たないので、詰まったミラーを掴むと
        # **無音のままジョブの timeout まで待つ** (実測 13 分。同時刻の別ジョブは 58 秒)。
        run: sh tools/ci-linux-deps.sh --lld

      # 整形は全ファイル適用済み。ここを通しておけば二度と債務が溜まらない。
      # clippy より先に置くのは、失敗したときの直し方が最も自明だから
      # (`cargo fmt --all` を実行して commit するだけ)。
      - name: fmt
        run: cargo fmt --all --check

      # ■ ラチェット方式 (whitelist ではなく blocklist):
      #   `-D warnings` で「rustc の全警告 + clippy の全 lint」を deny した上で、
      #   2026-08-02 時点で既に発生している 26 種 / 69 件だけを個別に -A で逃がす。
      #   - 新種の lint / 新規の rustc 警告は即 CI 赤になる (= 債務が増えない)。
      #   - とくに CLAUDE.md が要求する `never used` (dead_code) の検出が
      #     ここで自動化される。現時点で rustc 警告は 0 件なので取りこぼしがない。
      #   - 下の -A を 1 行消すごとに債務が 1 lint 分返済される。件数はコメント参照。
      #   ローカル再現: このコマンドをそのまま実行する (exit 0 を確認済み)。
      - name: clippy (deny all except the frozen debt list)
        run: |
          set -euo pipefail
          DEBT=(
            # 18件
            -A clippy::cloned_ref_to_slice_refs
            # 10件
            -A clippy::assertions_on_constants
            # 7件
            -A clippy::type_complexity
            # 4件
            -A clippy::manual_contains
            # 3件
            -A clippy::unnecessary_sort_by
            # 各2件
            -A clippy::map_identity
            -A clippy::derivable_impls
            -A clippy::manual_inspect
            -A clippy::neg_cmp_op_on_partial_ord
            -A clippy::collapsible_match
            -A clippy::doc_lazy_continuation
            # 各1件
            -A clippy::empty_line_after_doc_comments
            -A clippy::int_plus_one
            -A clippy::explicit_counter_loop
            -A clippy::single_range_in_vec_init
            -A clippy::cmp_owned
            -A clippy::manual_div_ceil
            -A clippy::field_reassign_with_default
            -A clippy::needless_return
            -A clippy::manual_repeat_n
            -A clippy::manual_clamp
            -A clippy::if_same_then_else
            -A clippy::question_mark
            -A clippy::single_match
            -A clippy::redundant_pattern_matching
            -A clippy::io_other_error
          )
          cargo clippy --all-targets --locked -- -D warnings "${DEBT[@]}"

      # 参考情報。落とさない (ゲートではない) が、債務の残量を毎 run 可視化して
      # 「いつ fmt を通せるか」「clippy 債務が減っているか」を数字で追えるようにする。
      # 情報表示だけのステップ。**絶対に失敗してはいけない。**
      #
      # 以前はここで rustfmt の未適用件数を数えていたが、fmt を全ファイルへ
      # 適用して上の `fmt` ステップを hard gate にした結果、
      # `grep '^Diff in '` がマッチ 0 件で exit 1 を返し、`set -o pipefail` が
      # それをパイプライン全体の失敗へ昇格させ、既定シェルの `-e` が
      # **情報表示のためだけのステップで CI を赤くした** (実際に起きた)。
      # 「綺麗になったから落ちる」という最悪の回帰なので、数え上げごと捨てた。
      # fmt の残量は常に 0 (通らなければ手前のステップで落ちる) ので、
      # 数える意味がそもそも無い。
      - name: 債務レポート (informational)
        if: always()
        run: |
          {
            echo "### 静的解析の債務 (ゲートではない / 残量の可視化)"
            echo ""
            echo "| 項目 | 残量 |"
            echo "| --- | ---: |"
            echo "| rustfmt 未適用 | 0 (fmt ステップが hard gate) |"
            echo "| clippy 凍結 lint 種別 | 26 |"
            echo ""
            echo "clippy の -A を 1 行消すごとに債務が 1 種類返済される (.github/workflows/test.yml)。"
          } >> "$GITHUB_STEP_SUMMARY"
  # スマホ画面 (assets/remote/) を **本物のブラウザで描いて**検査する。
  #
  # ■ なぜ要るのか
  #   0.18 系で「端末と一覧が同時に見える」が出荷まで生き残った。原因は
  #   CSS の詳細度 (`#alist.mid` が `#alist{display:none}` に勝っていた) で、
  #   Rust のテストは 1 本も落ちていない — **誰も CSS を評価していなかった**。
  #   経緯と層の地図は docs/preflight.md。
  #
  # ■ 安い
  #   Rust を 1 行もコンパイルしない (assets/remote/ は読むだけ)。
  #   ubuntu ランナーには Chrome も Node も最初から入っており、
  #   npm パッケージは 1 つも要らない (WebSocket も自前)。
  #
  # ■ `[skip]` を緑にしない
  #   remote-check.sh は node / ブラウザが無いと **rc=0 のまま降りる**。
  #   手元ではそれが正しいが、CI で通すと**何も描かないジョブが永久に緑**に
  #   なる。ここは揃っている前提なので、降りたら赤にする。
  remote-screen:
    # fast / pty / msrv / installers / lint / gui-smoke と**同じ判定**にすること。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(github.event.pull_request.head.ref == 'main' ||
        startsWith(github.event.pull_request.head.ref, 'night/'))
    name: mobile screen (chrome)
    runs-on: ubuntu-latest
    # **最後の砦**。ここに来る前に、道具が自分で理由を書いて赤で終わること
    # (ZV_DEADLINE_MS 6 分 < ZV_WALL_S 7 分 < ここ 8 分)。この順序を
    # 崩すと「無音のまま打ち切り」に戻り、原因が 1 行も残らない。
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 使う道具の版を出す (降りた理由を後から辿れるように)
        run: |
          node --version
          (google-chrome --version || chromium --version || echo 'ブラウザが見つかりません')
          # コンテナだと 64MB しか無いことがある (Chrome が固まる定番)。
          df -h /dev/shm || true
          nproc || true

      # わざと壊して赤になることまで確かめる (--self-test)。
      # 素通りする検査を CI に置かない。
      #
      # **出力を変数へ溜めない。** 以前は out=$(...) で溜めていたので、
      # 固まると 15 分間 1 バイトも出ないまま打ち切られ、どこで止まったのか
      # 1 行も残らなかった。tee で素通ししながら控えを取る。
      - name: スマホ画面を描いて不変条件を確かめる
        env:
          # ジョブの timeout より必ず短くする。**道具のほうが先に**
          # 「なぜ終わらないか」を書いて赤で終わるのが要点。
          ZV_DEADLINE_MS: '360000'
          ZV_STALL_MS: '120000'
          ZV_WALL_S: '420'
          ZV_HEARTBEAT_MS: '20000'
        run: |
          set -o pipefail
          log=$(mktemp)
          rc=0
          sh tools/remote-check.sh --self-test 2>&1 | tee "$log" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::スマホ画面の検査が赤 (rc=$rc)"
            exit "$rc"
          fi
          if grep -q '\[skip\]' "$log"; then
            echo "::error::スマホ画面を 1 度も描かずに降りた (このジョブでは skip は不合格)"
            exit 1
          fi
