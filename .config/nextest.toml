# nextest 設定 — CI 用プロファイル。
#
# 背景: terminal:: (実PTY) テストは長寿命の cargo test プロセス内で
# ログインシェルの孫プロセス (sleep / while-true) をリークさせ、
# Linux ランナーのハートビート喪失を引き起こしていた。
# nextest はテストごとにプロセスを分離し、slow-timeout 到達時に
# プロセスグループごと kill するため、孤児が stdout パイプを
# 掴み続けることがない。
#
# 直列化するのは「実際に PTY を起動する 4 モジュール」だけである点に注意。
# terminal:: には純粋なロジックテストが約 100 件あり、それらを直列化するのは
# CI 時間の丸損だった (5 分予算のための最重要チューニング)。
#
# 実行例: cargo nextest run --profile ci -E 'not test(/^terminal::(pty_tests|pty_writer_tests|reap_pty_tests|pty_resize_tests)::/)'

[profile.ci]
# 60 秒応答なしでプロセスグループごと terminate (SIGTERM 後 5 秒待って SIGKILL)。
# terminate-after = 1: ハング 1 件のコストは ~65 秒。CI 5 分予算の要。
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }
# テスト終了後、子プロセスが標準出力ハンドルを 1 秒以上握っていたらリーク扱い。
leak-timeout = "1s"
# 失敗したテストの出力は失敗時に即表示し、最後にもまとめて再表示。
failure-output = "immediate-final"

[test-groups]
# 実PTYテストは同時実行するとシェル起動が競合しフレーキーになるため直列化。
pty = { max-threads = 1 }
# 実 `git` を起動するテスト。1 件が数十本の子プロセスを撃つ (worktree 作成・
# コミット・スキャン) ため、無制限に並べるとプロセス生成が詰まり、
# **単独 6.7 秒のテストが 60 秒の slow-timeout に当たる**。
# `terminate-after = 1` なので 1 件当たれば**全体の実行が中断**する
# (実測: 2346/2875 で停止)。フレーキーではなく飽和なので、
# 同時実行数を絞って解く。
git = { max-threads = 4 }

[[profile.ci.overrides]]
# 実 PTY を起動するモジュールのみ。他の terminal:: テストは並列で構わない。
filter = 'test(/^terminal::(pty_tests|pty_writer_tests|reap_pty_tests|pty_resize_tests)::/)'
test-group = "pty"
# 実シェル起動を伴うが keep-alive スリープは 5-10 秒に短縮済みのため 45 秒で十分。
# ハング 1 件のコストは ≤50 秒 (旧設定の 4 分から短縮)。
slow-timeout = { period = "45s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
# 実 `git` を起動するモジュール。純粋ロジックのテストも同じ名前空間に居るが、
# 分けるほどの数ではない (合計 158 件) ので、モジュール単位で束ねる。
filter = 'test(/^(race|worktree|git_panel|git)::/)'
test-group = "git"
# 子プロセスの起動待ちを含むので PTY と同じ 45 秒を与える。
# 単独実行はいずれも 10 秒未満なので、ここに当たるのは異常のときだけ。
slow-timeout = { period = "45s", terminate-after = 2, grace-period = "5s" }
